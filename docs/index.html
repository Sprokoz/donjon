      (function () {
        var attempted = false;
        function checkBootAndFallback() {
          if (attempted || window.__DUNGEON_BOUNCER_BOOTED__) return;
          attempted = true;
          var path = window.location.pathname || '/';
          var inDocs = /\/docs(\/|$)/.test(path);
          if (!inDocs && window.location.protocol.indexOf('http') === 0) {
            var base = path.endsWith('/')
              ? path
              : path.endsWith('/index.html')
              ? path.slice(0, -10)
              : path + '/';
            var docsUrl = base + 'docs/';
            fetch(docsUrl + 'index.html', { cache: 'no-store' })
              .then(function (res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.text();
              })
              .then(function (html) {
                if (html && html.indexOf('assets/') !== -1) {
                  window.location.replace(docsUrl + window.location.search + window.location.hash);
                }
              })
              .catch(function () {});
          }
        }

        if (document.readyState === 'complete') {
          setTimeout(checkBootAndFallback, 180);
        } else {
          window.addEventListener('load', function () {
            setTimeout(checkBootAndFallback, 180);
          });
        }
        setTimeout(function () {
          if (window.__VITE_ENTRY_ERR__) checkBootAndFallback();
        }, 250);
      })();
